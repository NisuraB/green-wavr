<style>
:root{
  --page:#5f8a4e;--sign:rgba(22,128,138,.88);--sign-edge:rgba(255,255,255,.55);--sign-text:#ffffff;
  --sign-soft:rgba(255,255,255,.8);--scrim:rgba(18,24,20,.42);--stop:#e0362c;--amber:#f2c230;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#1d2a1f;--sign:rgba(14,92,100,.92);--sign-edge:rgba(255,255,255,.45);--sign-text:#f4f7f4;
    --sign-soft:rgba(244,247,244,.76);--scrim:rgba(6,10,8,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#1d2a1f;--sign:rgba(14,92,100,.92);--sign-edge:rgba(255,255,255,.45);--sign-text:#f4f7f4;
  --sign-soft:rgba(244,247,244,.76);--scrim:rgba(6,10,8,.6);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--page);color:var(--sign-text);
  font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
.sign{
  background:var(--sign);border:0;border-radius:6px;color:var(--sign-text);
  box-shadow:0 4px 14px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.stats{display:flex;flex-direction:column;min-width:0;flex:0 1 210px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 10px}
.row+.row{border-top:2px solid rgba(255,255,255,.18)}
.row span{font:600 14px/1.2 "Barlow",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{font:700 21px/1.1 "Barlow Condensed",sans-serif}
.ok{color:#74ff8f}.bad{color:#ff6b5c}.warn{color:#ffc94a}
#linkBtn.on{background:rgba(255,255,255,.18)}
.right{display:flex;flex-direction:column;align-items:stretch;overflow:hidden}
.right b{font:700 26px/1 "Barlow Condensed",sans-serif;text-align:center;padding:6px 12px 5px;letter-spacing:.02em}
.btns{display:flex;border-top:2px solid rgba(255,255,255,.18)}
.iconbtn{
  pointer-events:auto;touch-action:manipulation;height:38px;min-width:44px;flex:1;padding:0 8px;border:0;border-radius:0;
  background:transparent;color:var(--sign-text);font:700 15px "Barlow Condensed",sans-serif;cursor:pointer;
  display:flex;align-items:center;gap:5px;justify-content:center;
}
.iconbtn+.iconbtn{border-left:2px solid rgba(255,255,255,.18)}
.iconbtn .lampmini{width:9px;height:9px;border-radius:50%;background:#ff3b30;box-shadow:0 0 6px #ff3b30}
.iconbtn:focus-visible,.go:focus-visible,.lvl:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hint{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  padding:8px 14px;font:600 16px/1.25 "Barlow Condensed",sans-serif;text-align:center;
  width:max-content;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .6s;
}
.hint.hide{opacity:0}
.toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);
  padding:8px 14px;font:600 15px/1.35 "Barlow",sans-serif;text-align:center;pointer-events:none;transition:opacity .4s}
.toast.hide{opacity:0}
.card .levels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.card .lvl{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:86px;padding:9px 10px 8px}
.lvl .num{position:absolute;top:8px;right:10px;font:700 15px "Barlow Condensed",sans-serif;opacity:.55}
.lvl b{font:700 18px/1.05 "Barlow Condensed",sans-serif;padding-right:18px}
.lvl .tag{font-size:12.5px;color:var(--sign-soft)}
.lvl .foot{margin-top:auto;font:700 14px "Barlow Condensed",sans-serif;color:var(--sign-soft)}
.stars{color:#ffd34d;letter-spacing:2px;font-size:15px}.stars.none{color:rgba(255,255,255,.35)}
.packh{grid-column:1/-1;font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--sign-soft);margin:8px 0 -2px}
.modes{display:flex;gap:6px;margin:4px 0 6px}

.mode.on{background:#fff;color:#0f6f78}
.mode:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.modedesc{font-size:13.5px!important;margin:0 0 6px!important}
.bigstars{color:#ffd34d;font-size:34px;letter-spacing:6px;margin:2px 0 6px}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:16px;overflow-y:auto}
.screen.hide{display:none}
.card{max-width:420px;width:100%;padding:20px 20px 18px;text-align:left;margin:auto}
.card h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:50px;line-height:.95;margin:0 0 6px}
.card h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:36px;line-height:1;margin:0 0 8px}
.card p{margin:0 0 12px;font-size:15px;line-height:1.45;color:var(--sign-soft)}
.levels{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.lvl{
  text-align:left;width:100%;padding:10px 12px;border-radius:8px;border:2px solid var(--sign-edge);
  background:rgba(255,255,255,.08);color:var(--sign-text);cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;gap:2px;font-family:inherit;
}
.lvl b{font:700 21px/1.05 "Barlow Condensed",sans-serif}
.lvl span{font-size:13px;color:var(--sign-soft);line-height:1.35}
.lvl[disabled]{opacity:.45;cursor:default}
.howto{font-size:13.5px;line-height:1.45;color:var(--sign-soft);margin:0;padding-left:0;list-style:none}
.howto li{margin-bottom:4px}
.results{display:flex;gap:20px;margin:4px 0 16px}
.results div{display:flex;flex-direction:column;line-height:1}
.results small{font-size:13px;color:var(--sign-soft);margin-bottom:4px}
.results b{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700}
.go{
  display:block;width:100%;padding:11px 16px;border-radius:8px;border:2px solid var(--sign-edge);
  background:#fff;color:#0f6f78;font:700 21px "Barlow Condensed",sans-serif;cursor:pointer;touch-action:manipulation;
}
.go.secondary{background:transparent;color:var(--sign-text);margin-top:9px}
@media (prefers-reduced-motion: reduce){.hint{transition:none}}
</style>
</head>

/* ---------- world ---------- */
const OPP={N:'S',S:'N',E:'W',W:'E'};
function nodeDefs(){
  if(level.highway) return [];
  if(level.nodes) return level.nodes;
  if(level.twin) return [{dx:0,dy:-7.5,arms:ALL,link:{S:1}},{dx:0,dy:7.5,arms:ALL,link:{N:0}}];
  return [{dx:0,dy:0,arms:level.arms,link:{}}];
}
function bearDelta(a,b){ let d=((b-a)%360+540)%360-180; return d; }
const lane0=(xi,m)=>({xi,x:0,moves:m,base:m,closed:false,paths:{},light:[0,0],green:false,wait:0,queue:[],group:0});
function buildWorld(){
  nodes=nodeDefs().map(d=>({x:0,y:0,dx:d.dx||0,dy:d.dy||0,arms:d.arms,link:d.link||{},star:!!d.star,narrow:!!d.narrow,boxR:0}));

  if(level.highway){ buildHighway(); return; }
  nodes.forEach(n=>{
    if(n.star){
      n.arms.forEach((b,i)=>{
        const others=n.arms.map((b2,j)=>({j,d:bearDelta(b+180,b2)})).filter(o=>o.j!==i).sort((p,q)=>p.d-q.d);
        const lanes=[];
        if(level.oneLane||others.length===1) lanes.push(lane0(-0.5,others.map(o=>'x'+o.j)));
        else { const h=Math.ceil(others.length/2); lanes.push(lane0(-0.5,others.slice(0,h).map(o=>'x'+o.j))); lanes.push(lane0(-1.5,others.slice(h).map(o=>'x'+o.j))); }
        lanes.forEach(l=>l.dirs=l.moves.map(m=>others.find(o=>'x'+o.j===m).d));
        approaches.push({a:b,k:b/90,n,idx:i,fed:false,lanes,allMoves:[...new Set(lanes.flatMap(l=>l.moves))],start:0,len:0,timer:.6+Math.random()*1.6,pend:null,bias:1,surge:1});
      });
      return;
    }
    n.arms.forEach(a=>{
      const k=ARMS.indexOf(a);
      const has=d=>n.arms.includes(ARMS[(k+d)%4]);
      const lanes=[];
      if(isRound()){
        const m=[]; if(has(3))m.push('R'); if(has(2))m.push('S'); if(has(1))m.push('L');
        lanes.push(lane0(-0.75,m));
      } else {
        let inner=has(1)?['L']:(has(2)?['S']:[]);
        if(level.tram&&(a==='N'||a==='S')&&has(2)&&!inner.includes('S')) inner=inner.concat('S');
        const outer=[]; if(has(2))outer.push('S'); if(has(3))outer.push('R');
        [[-0.5,inner],[-1.5,outer]].forEach(([xi,m])=>{ if(m.length) lanes.push(lane0(xi,m)); });
      }
      approaches.push({a,k,n,fed:n.link[a]!==undefined,lanes,allMoves:[...new Set(lanes.flatMap(l=>l.moves))],start:0,len:0,timer:.6+Math.random()*1.6,pend:null,bias:1,surge:1});
    });
  });
}
function exitArm(A,m){ return ARMS[(A.k+{L:1,S:2,R:3}[m])%4]; }
function nextApproach(A,m){

  const e=exitArm(A,m), ni=A.n.link[e];

}
function finish(pts,o){

  o.pts=pts; o.cum=cum; o.barS=Infinity; o.railIn=Infinity; o.railOut=-Infinity;

    let a=Infinity,b=-Infinity;
    for(let i=0;i<pts.length-1;i++){
      const [x0,y0]=pts[i],[x1,y1]=pts[i+1];
      for(const yy of [ty-tb,ty+tb]){
        if(y0!==y1 && (y0-yy)*(y1-yy)<=0){ const f=(yy-y0)/(y1-y0), s=cum[i]+f*(cum[i+1]-cum[i]); a=Math.min(a,s); b=Math.max(b,s); }

function rawPath(k,laneX,move,start,n,exitLen){

    const r=3*w, C=[laneX+r,0.5*w-r];

    const r=0.9*w, C=[laneX-r,-1.5*w-r];

function makePath(k,laneX,move,start,n,l){

function joinPts(pts,next){

function starPath(A,l,m){

function getPath(A,l,key){

    const parts=key.split('>'); const hops=[{A,l,m:parts[0]}];
    for(let i=1;i<parts.length;i++){ const prev=hops[i-1], B=nextApproach(prev.A,prev.m); if(!B) break; hops.push({A:B,l:B.lanes[+parts[i][0]]||B.lanes[0],m:parts[i][1]}); }

function straightKey(A,lane){

function makeRoundPath(k,laneX,move,start){

/* ---------- layout ---------- */
function resize(){
  const r=cv.getBoundingClientRect();
  sW=r.width; sH=r.height; DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(sW*DPR); cv.height=Math.round(sH*DPR);

}
function setView(){
  phi=(level.rot||0)*Math.PI/180;

}
function toWorld(x,y){const dx=x-sW/2,dy=y-sH/2,c=Math.cos(-phi),s=Math.sin(-phi);return [W/2+(dx*c-dy*s)*mir(),H/2+dx*s+dy*c];}

function geom(){
  const m=Math.min(sW,sH);

  }

  cx=W/2; cy=H/2+(sH>sW?14:4);

  if(level.rail && sH>sW) cy=H*0.42;
  edge={N:cy,E:W-cx,S:H-cy,W:cx};
  nodes.forEach(n=>{ n.x=cx+n.dx*w; n.y=cy+n.dy*w; });
  geomSpecial();
  approaches.forEach(A=>{ const n=A.n; if(!n) return;
    if(A.fed){ const o=nodes[n.link[A.a]]; A.len=Math.hypot(o.x-n.x,o.y-n.y)/2; }

  }
  if(level.highway) geomHighway();
  else approaches.forEach(A=>{ A.start=A.len+3*w; A.lanes.forEach(l=>{ l.x=l.xi*w; l.paths={}; l.light=isRound()?toScreen(l.x,-stopD+0.1*w,A.k,A.n):toScreen(l.x,-(bxOf(A)+cwd*.5),A.k,A.n); }); });
  cars.forEach(c=>{const np=getPath(c.A,c.lane,c.key);c.s=np.stopS+(c.s-c.path.stopS);c.path=np;c.stops.forEach((st,i)=>st.s=np.stopList[i]);pose(c);});

function makeFlakes(){

  for(let i=0;i<n;i++) flakes.push({x:Math.random()*sW,y:Math.random()*sH,r:.5+Math.random()*1.5,vy:14+Math.random()*30,ph:Math.random()*TAU});

/* ---------- star junctions, narrow bridges and motorways ---------- */
let hwRamps=[], caps=[];
function pal(){ return level.snow?{walk:'#dfe4e8'}:{walk:'#b9b5ab'}; }
function bxOf(A){ return A.n&&A.n.star?A.n.boxR:hr; }

    approaches.filter(A=>A.n===n).forEach(A=>{ for(let d=0; d<A.len+2*w; d+=.7*w){ const p=toScreen(0,-d,A.k,n); caps.push({x:p[0],y:p[1],r:hr+SW}); } });

function trainHits(){

    return;
  }

  for(const c of cars){

    if(Math.min(c.f[1],c.b[1])>ty+tb+w || Math.max(c.f[1],c.b[1])<ty-tb-w) continue;
    for(const a of circlesOf(c)){
      if(Math.abs(a[1]-ty)<tb+c.wid*.3 && a[0]>x0-.2*w && a[0]<x1+.2*w){ crash(c,null,a[0],a[1]); return; }

function step(dt){
  t+=dt; biasTimer-=dt;
  if(biasTimer<=0){ biasTimer=15+Math.random()*10; approaches.forEach(A=>A.bias=.75+Math.random()*.9); const sp=approaches.filter(X=>!X.fed); sp[Math.random()*sp.length|0].bias=.5; }
  const base=(mode==='arcade'?Math.max(.95,3.0-t*.03):Math.max(1.15,3.4-t*.018))/level.rate;
  updateEvents(dt); hourTick(); if(state!=='play') return;
  const gr=grip(), DEC=7*gr*w, DEC_HARD=13*gr*w, GAP=.3*w;
  if(level.rail) updateRail(dt);
  if(level.works) updateWorks(dt);
  if(level.surge) updateSurge(dt);
  if(level.vip){ updateVip(dt); if(state!=='play') return; }
  if(level.rain){ thunderT-=dt; if(thunderT<=0){ lightning=1; thunderT=14+Math.random()*16; setTimeout(()=>tone(55,1.2,'sawtooth',.05),600); } }

  for(const A of approaches){
    if(A.fed) continue;
    A.timer-=dt;
    A.lanes.forEach(l=>{ if(l.closed&&!laneActive(l)) l.green=false; });
    if(A.pend&&A.pend.lane.closed) A.pend=null;
    if(vip.phase==='spawn'&&vip.A===A){
      if(vip.queue.length&&spawnCar(A,vip.lane,straightKey(A,vip.lane),vip.queue[0])){ vip.queue.shift(); if(!vip.queue.length) vip.phase='run'; }
    } else if(A.timer<=0){
      if(!A.pend) A.pend=chooseMove(A);
      if(spawnCar(A,A.pend.lane,A.pend.move)){ A.pend=null;
        if(A.hw==='main'){ if(A.burst>0){ A.burst--; A.timer=.42+Math.random()*.3; } else { A.burst=3+(Math.random()*6|0); A.timer=(2.2+Math.random()*3.4)/level.rate; } }
        else A.timer=base*A.bias*A.surge*(.55+Math.random()*.9); }
    }
    for(const l of A.lanes){
      l.wait=(A.pend&&A.pend.lane===l)?l.wait+dt:Math.max(0,l.wait-dt*2);
      if(l.wait>=JAM_LIMIT){ gameOver('Gridlock on the '+armName(A.a)+' road. That lane backed up for too long.'); return; }
    }
  }

  for(const c of cars){
    if(c.crashed||c.broken) continue;
    const p=c.path;
    let lim=Infinity, leadGap=Infinity, leadV=Infinity;
    const look=c.v*c.v/(2*DEC)+2.6*w;
    for(const o of cars){
      if(o===c) continue;
      if(o.hx*c.hx+o.hy*c.hy<.5) continue;
      const vx=o.b[0]-c.f[0], vy=o.b[1]-c.f[1];
      const gap=vx*c.hx+vy*c.hy;
      if(gap<-.15*c.len||gap>look) continue;
      if(Math.abs(vx*c.hy-vy*c.hx)>.55*w) continue;
      if(gap<leadGap){leadGap=gap;leadV=o.v;}
      lim=Math.min(lim,gap-GAP);
    }
    // following around the ring
    if(p.round && c.s>p.stopS && c.s<p.ringS1+.5*w){
      const thc=ringAng(p,c.s);
      for(const o of cars){
        if(o===c||!o.path.round||o.s<=o.path.stopS) continue;
        let gap;
        if(o.s<o.path.ringS0){
          // a car about to merge: keep its merge point clear
          if(o.path.ringS0-o.s>3.2*w) continue;
          gap=mod(thc-o.path.thm)*Rr-2*w;
          if(gap<-.6*w) continue;
        } else {
          const ob=o.s-o.len;
          if(ob<o.path.ringS0-.3*w||ob>o.path.ringS1+.2*w) continue;
          gap=mod(thc-ringAng(o.path,ob))*Rr;
        }
        if(gap<look){ lim=Math.min(lim,gap-GAP); if(gap<leadGap){leadGap=gap;leadV=o.v;} }
      }
    }
    const st=c.stops[c.si], toStop=st?st.s-c.s:-1e9, lane=st?st.lane:null;
    if(level.peds){
      const need=c.v*c.v/(2*DEC_HARD);
      for(const q of peds){ if(q.st!=='walk') continue;
        const vx=q.X-c.f[0], vy=q.Y-c.f[1], gap=vx*c.hx+vy*c.hy;
        if(gap>-.2*w&&gap<look&&gap-.55*w>need&&Math.abs(vx*c.hy-vy*c.hx)<.7*w) lim=Math.min(lim,gap-.55*w); }
    }
    // roundabout: yield to traffic already on the ring
    let blocked=false;
    if(p.round && !c.committed && toStop<2.5*w){
      const yA=4.4*w/Rr, cA=1.1*w/Rr;
      for(const o of cars){
        if(o===c||o.s<=o.path.stopS) continue;
        const chk=s=>{ if(s>o.path.ringS1) return false; const u=mod((s<o.path.ringS0?o.path.thm:ringAng(o.path,s))-p.thm); return u<yA||u>TAU-cA; };
        if(chk(o.s)||chk(o.s-o.len)){blocked=true;break;}
      }
    }
    const mustStop=(lane?!lane.green:false)||blocked;
    if(!mustStop){ if(toStop<w*.05) c.committed=true; }
    else if(!c.committed){
      if(toStop<w*.05) c.committed=true;
      else if(toStop<c.v*c.v/(2*DEC_HARD)) c.committed=true;
      else lim=Math.min(lim,toStop-2);
    }
    // railway: barriers and keep-clear
    if(level.rail && c.s<p.barS){
      const toBar=p.barS-c.s;
      if(rail.down && !c.railGo){ if(toBar<c.v*c.v/(2*DEC_HARD)) c.railGo=true; else lim=Math.min(lim,toBar-2); }
      if(leadV<.5*w && leadGap<(p.railOut-c.s)+c.len+GAP) lim=Math.min(lim,toBar-2);
    }
    let desired=Math.min(c.max,Math.sqrt(2*DEC*Math.max(0,lim)));
    for(const tz of p.turns) if(c.s<tz[1]) desired=Math.min(desired,Math.sqrt(tz[2]*tz[2]+2*DEC*Math.max(0,tz[0]-c.s)));
    if(desired<c.v) c.v=desired; else c.v=Math.min(desired,c.v+c.acc*dt);
    c.s+=c.v*dt;
    if(st&&c.committed&&c.s>st.s+.3*w&&c.si<c.stops.length-1){ c.si++; c.committed=false; c.wait=0; c.rage=0; }
    if(!c.committed && toStop<1.2*w && c.v<.3*w){
      c.wait+=dt;
      const pt=level.patience||1, r1=c.amb?1.2:11*pt, r2=c.amb?3:17*pt;
      c.rage=c.wait>r1?1:0;
      if(c.vip||c.k==='tram'||mode==='free'){ c.rage=c.vip||c.k==='tram'?0:Math.min(c.rage,1); } else if(c.wait>r2){ c.committed=true; c.rage=2; honk(); if(!c.amb) addRage(); }
    }
  }
  if(state!=='play') return;
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i]; pose(c);
    if(c.towed){ removeCar(c); toast('The tow truck cleared the broken-down vehicle.',2.5); continue; }
    if(c.s>(c.path.stopList.length?c.path.stopList[c.path.stopList.length-1]:-1e9)+3*w){

        if(c.k==='fire'&&fire){ fire=null; toast('Fire engine through. The fire is out.',3); } }
    }
  }
  checkCollisions();
  if(level.peds&&freeze<=0) updatePeds(dt);
  if(mode==='goal'&&!level.endless&&state==='play'){
    if(passed>=level.goal) win();
    else if(clockMin()>=level.clock[1]*60) gameOver(`Time’s up at ${fmtClock(clockMin())}. ${passed} of ${level.goal} vehicles got through.`);
  }
}
function circlesOf(c){
  const n=Math.max(2,Math.ceil(c.len/c.wid)), out=[];
  for(let i=0;i<n;i++) out.push(posAt(c.path,c.s-c.len*(i+.5)/n));

}
function checkCollisions(){
  const R=isRound()?Ro+3*w:Math.max(6*w,...nodes.map(n=>n.boxR+3*w));
  const near=level.highway?cars.filter(c=>!c.crashed):cars.filter(c=>!c.crashed && nodes.some(n=>Math.abs(c.f[0]-n.x)<R+c.len && Math.abs(c.f[1]-n.y)<R+c.len));
  for(let i=0;i<near.length;i++){
    const p=near[i];
    for(let j=i+1;j<near.length;j++){
      const q=near[j];
      if(p.hx*q.hx+p.hy*q.hy>.94) continue;
      const mx=(p.f[0]+p.b[0]-q.f[0]-q.b[0])/2, my=(p.f[1]+p.b[1]-q.f[1]-q.b[1])/2;
      if(Math.hypot(mx,my)>(p.len+q.len)/2+w) continue;
      const rs=(p.wid+q.wid)*.5*.92, A=circlesOf(p), B=circlesOf(q);
      for(const a of A) for(const b of B){

    }
  }
}

function render(now){

    const [x,y]=l.light, r=w*1.9, g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,l.green?'rgba(70,255,140,.3)':'rgba(255,60,50,.3)'); g.addColorStop(1,l.green?'rgba(70,255,140,0)':'rgba(255,60,50,0)');
    ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r);
  }));
  if(level.highway) approaches.forEach(A=>A.lanes.forEach(l=>{ if(!l.stopPts) return; ctx.strokeStyle=l.green?'rgba(46,224,122,.8)':'rgba(255,59,48,.85)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(...l.stopPts[0]); ctx.lineTo(...l.stopPts[1]); ctx.stroke(); }));
  else approaches.forEach(A=>{ ctx.save(); ctx.translate(A.n.x,A.n.y); ctx.rotate(A.k*Math.PI/2);
    A.lanes.forEach(l=>{ ctx.fillStyle=l.green?'rgba(46,224,122,.75)':'rgba(255,59,48,.8)'; ctx.fillRect(l.x-w/2+1.5,-stopD-2.5,w-3,2.5); });
    ctx.restore(); });
  if(level.bridge) drawDeck();

  if(level.rail) (level.bridge?drawBoat():drawTrain());
  const na=nightAlpha();
  if(na>.01){
    ctx.fillStyle=level.snow?`rgba(16,40,80,${na})`:`rgba(6,24,40,${na})`; ctx.fillRect(-W,-H,3*W,3*H);
    ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.min(1,na/.45);

    if(level.rail&&!level.bridge) drawTrainLight();
    if(level.rain) cars.forEach(c=>{ const x=c.f[0]+c.hx*w*2.6, y=c.f[1]+c.hy*w*2.6, g=ctx.createRadialGradient(x,y,0,x,y,w*2.2); g.addColorStop(0,'rgba(255,235,190,.16)'); g.addColorStop(1,'rgba(255,235,190,0)'); ctx.fillStyle=g; ctx.fillRect(x-2.2*w,y-2.2*w,4.4*w,4.4*w); });

function drawTrainWarning(now){

  let x=rail.dir>0?0:W, p=null;
  for(let i=0;i<400;i++){ const q=toView(x,ty); if(q[0]>22&&q[0]<sW-22&&q[1]>100&&q[1]<sH-40){p=q;break;} x+=rail.dir*w*.5; }
  if(!p) return;

/* ---------- HUD & screens ---------- */
let lastHud='';
function updateHud(force){
  const key=passed+'|'+accidents+'|'+rageCount+'|'+Math.floor(clockMin())+level.id+mode;
  if(!force&&key===lastHud)return; lastHud=key;
  const goalMode=mode==='goal'&&!level.endless;
  $passLabel.textContent=goalMode?`Pass ${level.goal} by ${fmtClock(level.clock[1]*60)}`:'Passed vehicles';
  $passed.textContent=passed;
  $time.textContent=fmtClock(clockMin());
  $acc.textContent=mode==='free'?accidents:`${accidents}/${MAX_ACC}`;
  $('rowRage').style.display=mode==='free'?'none':'';
  $('rage').textContent=`${rageCount}/${rageLimit()}`;
  $('rowHour').style.display=goalMode&&level.perHour?'':'none';
  if(level.perHour){ $('hour').textContent=`${passed-hourStart}/${level.perHour}`; $('hour').className=passed-hourStart>=level.perHour?'ok':'warn'; }
}
function starStr(n){ return '★'.repeat(n)+'☆'.repeat(3-n); }
const MODES={goal:['Reach goal','Hit each road’s target before the clock runs out. Earn up to 3 stars.'],arcade:['Arcade','No target. Traffic builds fast. Three strikes and you’re out.'],free:['Unlimited','No limits and no angry drivers. Just practise and relax.']};
function bestKey(L){ return mode==='goal'?L.id:L.id+':'+mode; }
function showMenu(){
  state='menu'; $toast.classList.add('hide'); linkMode=false;
  let items='';
  PACKS.forEach((P,pi)=>{
    items+=`<div class="packh">${P}</div>`;
    LEVELS.forEach((L,i)=>{ if(L.pack!==pi) return;
      const best=progress.best[bestKey(L)], st=(progress.stars||{})[L.id]||0;
      const foot=mode==='goal'&&!L.endless?`<span class="stars${st?'':' none'}">${starStr(st)}</span>`:`Best ${best||0}`;
      items+=`<button class="lvl" data-i="${i}"><span class="num">${i+1}</span><b>${L.name}</b><span class="tag">${L.tag}</span><span class="foot">${foot}</span></button>`;
    });
  });
  $card.innerHTML=`<h1>Green Wave</h1>
    <p>The automatic signals are down. Every lane has its own light, and you run all of them.</p>
    <div class="modes" role="radiogroup" aria-label="Game mode">${Object.keys(MODES).map(m=>`<button class="mode${m===mode?' on':''}" role="radio" aria-checked="${m===mode}" data-m="${m}">${MODES[m][0]}</button>`).join('')}</div>
    <p class="modedesc">${MODES[mode][1]}</p>
    <div class="levels">${items}</div>
    <ul class="howto">
      <li>Tap a lane’s light to switch just that lane, or tap the road to switch every lane on it.</li>
      <li>Tap Link, then tap several lights, to make them switch together as one group.</li>
      <li>Three crashes ends the shift. So does too much road rage: every driver who runs a red adds to it, and each emergency vehicle you let through calms things down.</li>
    </ul>`;
  $screen.classList.remove('hide');
  $card.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>start(LEVELS[+b.dataset.i]));
  $card.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; progress.mode=mode; save(); showMenu(); });
}
function start(L){ audio(); startLevel(L||level); state='play'; $screen.classList.add('hide'); $pause.textContent='II'; }
function pause(){
  if(state!=='play')return; state='pause';
  $card.innerHTML=`<h2>Paused</h2>
    <div class="results"><div><small>Passed</small><b>${passed}</b></div><div><small>Time</small><b>${fmt(t)}</b></div></div>
    <button class="go" id="resumeBtn">Resume</button>
    <button class="go secondary" id="quitBtn">End shift</button>`;
  $screen.classList.remove('hide');
  $('resumeBtn').onclick=()=>{state='play';$screen.classList.add('hide');};
  $('quitBtn').onclick=()=>{ showMenu(); };
}
function recordBest(){ const k=bestKey(level), isBest=passed>(progress.best[k]||0); if(isBest) progress.best[k]=passed; save(); return isBest; }
function win(){
  state='over'; $toast.classList.add('hide');
  const i=LEVELS.indexOf(level);
  progress.unlocked=Math.max(progress.unlocked,Math.min(LEVELS.length-1,i+1));
  recordBest(); updateHud(true);
  const stars=Math.max(1,3-accidents-(rageCount>=Math.ceil(rageLimit()/2)?1:0)); progress.stars=progress.stars||{}; progress.stars[level.id]=Math.max(progress.stars[level.id]||0,stars); save();
  const next=LEVELS[i+1];
  $card.innerHTML=`<h2>Shift complete</h2>
    <div class="bigstars">${starStr(stars)}</div>
    <p>${level.name} is flowing again.</p>
    <div class="results"><div><small>Passed</small><b>${passed}</b></div><div><small>Clock</small><b>${fmtClock(clockMin())}</b></div><div><small>Accidents</small><b>${accidents}</b></div></div>
    ${next?`<button class="go" id="nextBtn">Next: ${next.name}</button>`:''}
    <button class="go ${next?'secondary':''}" id="menuBtn">All roads</button>`;
  $screen.classList.remove('hide');
  if(next) $('nextBtn').onclick=()=>start(next);
  $('menuBtn').onclick=showMenu;
}
function gameOver(reason){
  state='over'; $toast.classList.add('hide');
  const isBest=recordBest(); updateHud(true);
  $card.innerHTML=`<h2>Shift over</h2><p>${reason}</p>
    <div class="results"><div><small>Passed</small><b>${passed}</b></div><div><small>Clock</small><b>${fmtClock(clockMin())}</b></div><div><small>Best</small><b>${progress.best[bestKey(level)]||0}</b></div></div>
    <button class="go" id="againBtn">${isBest&&passed>0?'New best. Try again':'Try again'}</button>
    <button class="go secondary" id="menuBtn">All roads</button>`;
  $screen.classList.remove('hide');
  $('againBtn').onclick=()=>start(level);
  $('menuBtn').onclick=showMenu;
}

/* ---------- input ---------- */
function markTapped(){ if(!tapped){tapped=true;$hint.classList.add('hide');} }
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  const r=cv.getBoundingClientRect(), [x,y]=toWorld(e.clientX-r.left,e.clientY-r.top);
  let best=null, bd=Math.max(22,w*1.35);
  approaches.forEach(A=>A.lanes.forEach(l=>{ if(l.nolight||(l.closed&&!laneActive(l))) return; const d=Math.hypot(x-l.light[0],y-l.light[1]);if(d<bd){bd=d;best=l;}}));
  if(best){ e.preventDefault();
    if(linkMode){ best.group=best.group===curGroup?0:curGroup; click(!!best.group); return; }
    const v=!best.green;
    if(best.group){ approaches.forEach(A=>A.lanes.forEach(l=>{ if(l.group===best.group&&!(l.closed&&!laneActive(l))) l.green=v; })); }
    else best.green=v;
    click(v); markTapped(); return; }
  if(level.highway) return;
  for(const A of approaches){
    const inner=isRound()?Ro:bxOf(A);
    const [lx,ly]=toLocal(x,y,A.k,A.n);
    if(Math.abs(lx)<=hr+SW+6 && ly<-inner && ly>-A.len-3*w){
      e.preventDefault();
      const act=A.lanes.filter(l=>!(l.closed&&!laneActive(l))), allG=act.every(l=>l.green);
      act.forEach(l=>l.green=!allG); click(!allG); markTapped(); return;
    }
  }
});
$('linkBtn').addEventListener('click',toggleLink);
$('allRed').addEventListener('click',()=>{ if(state!=='play')return; approaches.forEach(A=>A.lanes.forEach(l=>l.green=false)); click(false); });
$pause.addEventListener('click',()=>{ if(state==='play')pause(); else if(state==='pause'){state='play';$screen.classList.add('hide');} });
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pause(); });
window.addEventListener('resize',resize);

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
  if(state==='play'){
    if(freeze>0){freeze-=dt;if(freeze<=0)afterCrash();}
    else step(dt);
    if(!tapped&&t>10)$hint.classList.add('hide');
    if(toastT>0){ toastT-=dt; if(toastT<=0) $toast.classList.add('hide'); }
    updateHud(false);
  }
  for(const p of particles){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;}
  particles=particles.filter(p=>p.life<p.max);
  lightning=Math.max(0,lightning-dt*2.5);
  if(level.rain) for(const f of flakes){ f.y+=f.vy*dt*14; f.x+=f.vy*dt*3; if(f.y>sH+10){f.y=-10;f.x=Math.random()*sW*1.2-sW*.1;} }
  else for(const f of flakes){ f.ph+=dt; f.y+=f.vy*dt; f.x+=Math.sin(f.ph*1.3)*12*dt-6*dt; if(f.y>sH+4){f.y=-4;f.x=Math.random()*sW;} if(f.x<-4)f.x=sW+4; }
  shake=Math.max(0,shake-dt*22);
  render(now);
  requestAnimationFrame(frame);
}
